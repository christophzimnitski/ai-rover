# Rover ROS 2 runtime. Usage (run from the Pi, inside this docker/ directory):
#
#   docker compose build                                   # build the image
#   docker compose run --rm rover colcon build --symlink-install   # build the workspace (once / after edits to setup)
#   docker compose up -d                                   # start the base driver
#   docker compose exec rover \
#       ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p repeat_rate:=15.0
#   docker compose down                                    # stop everything (Pi OS untouched)
services:
  rover:
    build: .
    image: ugv-rover:jazzy
    container_name: rover
    network_mode: host          # ROS 2 DDS discovery over localhost / the LAN
    ipc: host                   # faster shared-memory DDS transport
    devices:
      # On a Raspberry Pi 5 the ESP32 is on the GPIO14/15 PL011 UART = /dev/ttyAMA0
      # (enabled by dtparam=uart0=on). WARNING: /dev/serial0 is aliased to /dev/ttyAMA10 on
      # this Pi 5 — a DIFFERENT, unconnected UART; writing to it silently goes nowhere. The
      # stock Waveshare app hardcodes ttyAMA0 for the Pi 5 for exactly this reason. Map the
      # real device to a stable in-container path so the driver's serial_port stays "/dev/serial0".
      - "/dev/ttyAMA0:/dev/serial0"    # ESP32 driver board UART (Pi 5 GPIO14/15 PL011)
    # Gamepad: expose the host's input devices so joy_node can open /dev/input/js0.
    # Bind-mounting the whole /dev/input dir (rather than a fixed js0/event5) keeps
    # working when the dongle re-enumerates or the device index shifts. The cgroup
    # rule grants access to the input subsystem (char major 13 = js*/event*/mice);
    # without it Docker's default device cgroup blocks the nodes even when mounted.
    device_cgroup_rules:
      - "c 13:* rmw"
    volumes:
      - ../ugv_ws:/ros2_ws            # live-edit the colcon workspace from the Mac
      - /dev/input:/dev/input         # gamepad devices (js0 etc.) for joy_node
    environment:
      - ROS_DOMAIN_ID=0
    stdin_open: true            # teleop needs a live stdin...
    tty: true                   # ...and a TTY to read keypresses
    # Autostart on boot: the Docker daemon starts at boot (systemd) and brings this
    # container back up unless it was explicitly `docker compose stop`ped. So the rover
    # comes up driving on power-on -- our replacement for the stock app's @reboot crontab.
    # (Disable that stock crontab entry so it doesn't fight us for the ESP32 UART.)
    restart: unless-stopped
    # Default process: bring up the base driver. teleop is attached separately via `exec`.
    command: ros2 launch ugv_bringup rover.launch.py

  # Camera (THE SWAPPABLE PART): USB UVC cam -> /camera/image_raw. This is the ONLY
  # camera-specific service. To swap camera hardware, change THIS service + camera.launch.py
  # / config/camera.yaml -- the /camera/image_raw topic and everything downstream (web layer,
  # dashboard) never change. Reuses the ugv-rover:jazzy image (it carries usb_cam), just runs
  # a different launch file. Kept separate from `rover` so the base stack drives on if it dies.
  camera:
    image: ugv-rover:jazzy      # same image as `rover`; built by the `rover` service's `build:`
    container_name: rover-camera
    network_mode: host          # share the DDS graph with the other services over localhost
    ipc: host
    devices:
      # EMEET SmartCam C950 (USB UVC) enumerates as /dev/video0 (capture) + /dev/video1
      # (metadata); usb_cam opens video0. The Pi's own ISP/codec nodes are video19..35 --
      # not cameras. If a swapped-in camera lands on a different index, change this one line
      # (check `ls /dev/video*` and `ls /dev/v4l/by-id/` after plugging it in).
      - "/dev/video0:/dev/video0"
    device_cgroup_rules:
      - "c 81:* rmw"            # video4linux (char major 81) -- lets the node open the camera
    volumes:
      - ../ugv_ws:/ros2_ws       # same live-edited workspace (for camera.launch.py + config)
    environment:
      - ROS_DOMAIN_ID=0
    restart: unless-stopped      # autostart on boot; survives the reboot independence test
    command: ros2 launch ugv_bringup camera.launch.py

  # Web transport layer (camera-agnostic, swappable panel): rosbridge + web_video_server.
  #   rosbridge_server :9090 (JSON/WebSocket) -> roslibjs frontend subscribes /rover/telemetry
  #   web_video_server :8080 (MJPEG over HTTP) -> <img> src for the live view (ANY image topic)
  # A SEPARATE service from the driver, per the design: if the web layer crashes, the base
  # rover stack keeps driving. network_mode host binds :9090/:8080 on the Pi (LAN / Tailscale).
  webbridge:
    image: ugv-rover:jazzy
    container_name: rover-webbridge
    network_mode: host
    ipc: host
    volumes:
      - ../ugv_ws:/ros2_ws
    environment:
      - ROS_DOMAIN_ID=0
    restart: unless-stopped
    command: ros2 launch ugv_bringup webbridge.launch.py

  # Dashboard (THIN display layer) -- its own independent service. A zero-dependency static
  # site (vanilla HTML/JS talking rosbridge over WebSocket + an MJPEG <img>), served by the
  # base image's python3 -- no Node/npm/build. Independent of everything else: if it dies the
  # base stack keeps driving; if the backend dies the page just shows "stale". Browse to
  # http://<pi>:8090/  (the page reaches rosbridge :9090 + web_video_server :8080 itself).
  webapp:
    image: ugv-rover:jazzy
    container_name: rover-webapp
    network_mode: host
    volumes:
      - ../webapp:/webapp:ro       # static site, live-edited from the Mac (sync.sh); read-only
    restart: unless-stopped
    command: python3 -m http.server 8090 --directory /webapp
