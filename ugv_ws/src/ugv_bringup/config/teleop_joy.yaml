# Gamepad teleop: /dev/input/js0 -> joy_node -> /joy -> teleop_twist_joy -> /cmd_vel.
# The ugv_driver turns /cmd_vel into ESP32 wheel commands, so nothing below /cmd_vel
# changes when you swap controllers -- only this file does.
#
# SWAPPING CONTROLLERS: the axis/button *indices* below depend on the specific pad
# and how the kernel/SDL2 enumerate it. To find the right values for a new controller:
#   docker compose exec rover /entrypoint.sh ros2 run joy joy_node        # publishes /joy
#   docker compose exec rover /entrypoint.sh ros2 topic echo /joy         # watch indices
# Move ONE control at a time and note which axis/button entry changes:
#   - push LEFT stick fully UP    -> that axis index = axis_linear.x  (note the sign!)
#   - push RIGHT stick fully RIGHT-> that axis index = axis_angular.yaw
#   - press your intended deadman -> that button index = enable_button
# Then update the indices here and `docker compose restart rover` (no rebuild needed).
#
# Current values: GameSir Nova Lite via 2.4GHz USB dongle ("Zikway HID gamepad"),
# Xinput-style layout (js0: axes 0/1 = left stick, 2/3 = right stick, 4/5 = triggers).

joy_node:
  ros__parameters:
    device_id: 0          # 0 = /dev/input/js0 (first joystick)
    deadzone: 0.10        # fraction of range treated as centre -> exact 0.0. Back down from 0.15:
                          # that was guarding against min_wheel_speed (then 0.10) turning leaked
                          # stick drift into a constant creep — the floor is now 0 (wheel_trim
                          # replaces it, and trim hard-zeros on a zero command), so a tighter
                          # deadzone buys finer low-speed control. Raise again if drift creeps back.
    autorepeat_rate: 20.0 # Hz; republish /joy even when idle so /cmd_vel keeps feeding
                          # the driver watchdog (cmd_timeout 0.5s) while the deadman is held

teleop_twist_joy_node:
  ros__parameters:
    # --- Deadman / turbo -------------------------------------------------------
    require_enable_button: true   # SAFETY: rover only moves while the deadman is held
    enable_button: 8              # DEADMAN = LT: hold the LEFT trigger to drive (button 8 = LT digital)
    enable_turbo_button: 9        # TURBO = RT: hold the RIGHT trigger for the turbo scales (button 9 = RT digital)
                                  # (triggers are dual-reported on this pad: LT = axis 5 / button 8, RT = axis 4 / button 9)

    # --- Linear (forward/back on left stick Y) ---------------------------------
    # Left stick fully UP drives axis 1 NEGATIVE. GROUND-TESTED: a POSITIVE scale gives
    # up = forward, down = reverse (a negative scale inverted it), so the sign is +.
    axis_linear:
      x: 1                        # left stick Y (confirmed)
    scale_linear:
      x: 0.25                     # m/s at full stick, normal mode (up = forward)
    scale_linear_turbo:
      x: 0.50                     # m/s at full stick, turbo (matches max_wheel_speed 0.5)

    # --- Angular (turn on right stick X) ---------------------------------------
    # Right stick fully RIGHT drives axis 2 POSITIVE. GROUND-TESTED: a POSITIVE scale gives
    # right-stick = right turn (a negative scale mirrored it), so the sign is +.
    axis_angular:
      yaw: 2                      # right stick X (confirmed)
    scale_angular:
      yaw: 2.4                    # rad/s at full stick, normal (was 1.2; raised to the old turbo
                                  #   value per feel -> ~0.21 m/s/wheel = 42% of max wheel speed).
    scale_angular_turbo:
      yaw: 5.7                    # rad/s at full stick, turbo = near-max in-place turn
                                  #   (5.7 * 0.0875 = 0.499 m/s/wheel ~= max_wheel_speed 0.5).
