ugv_driver:
  ros__parameters:
    # Serial link to the ESP32 General Driver Board.
    serial_port: "/dev/serial0"   # in-container path; compose maps host /dev/ttyAMA0 -> here
    baud: 115200                  # Pi 5: ESP32 is on host /dev/ttyAMA0 (NOT serial0 -> ttyAMA10)

    # Differential-drive geometry / limits.
    track_width: 0.175            # m, distance between the two treads' CENTRELINES
                                  # (contact-patch centres) = the kinematic track for
                                  # diff-drive. NOT the 0.13 m inner gap between treads
                                  # (13 gap + 4.5 tread width = 17.5 centre-to-centre).
    max_wheel_speed: 0.5          # {"T":1} saturates here: firmware maps value*512 -> PWM,
                                  # so 0.498 = PWM 255 = full throttle (docs/FIRMWARE.md)
    angular_gain: 1.0             # KEEP AT 1.0. This scales angular.z BELOW the /cmd_vel
                                  # seam, so any other value means /cmd_vel is no longer a
                                  # faithful physical contract (true rad/s) for EVERY
                                  # publisher -- including future autonomy, which would then
                                  # silently turn wrong. Tune turn *feel* ABOVE the seam, in
                                  # teleop_joy.yaml (scale_angular / scale_angular_turbo).

    # Stiction floor (legacy): any NON-ZERO wheel command below this magnitude is bumped
    # up to it. OFF now that wheel_trim closes the loop -- the trim integrator finds the
    # right boost per surface instead of a fixed floor amplifying stick drift. Re-raise
    # to ~0.10 only if you also turn wheel_trim off.
    min_wheel_speed: 0.0          # m/s (0 = off)

    # Speed trim: Pi-side closed loop over the OPEN-LOOP firmware (the board maps
    # {"T":1} straight to PWM; same command = different real speed per surface, and
    # low commands stick then lurch). A slow per-wheel integrator nudges the outgoing
    # command until the encoder-reported speed matches the commanded speed: breaks
    # stiction smoothly and makes /cmd_vel physically true on any surface.
    wheel_trim: true
    trim_ki: 1.2                  # 1/s; raise for faster convergence, lower if it hunts
    trim_limit: 0.25              # max correction ever added to a wheel command

    # Web driving (dashboard joystick -> /web_cmd_vel): accepted only while /cmd_vel
    # (gamepad / autonomy) has been quiet this long. The gamepad always wins.
    mux_window: 0.5               # s

    # Safety.
    cmd_timeout: 0.5              # s, stop if drive commands go quiet (crash / SSH drop)
    board_heartbeat_ms: 1000      # firmware-side dead-man ({"T":136}): the BOARD stops
                                  # itself if no command arrives for this window -- covers
                                  # the whole Pi stack dying mid-drive. 0 = leave firmware
                                  # default (3000ms).
    require_serial: true          # set false to dry-run the node without hardware

    # Telemetry (read path): stream the ESP32 feedback and republish it as typed
    # /rover/telemetry (ugv_msgs/Telemetry) + /rover/battery (voltage).
    telemetry: true
    telemetry_interval_ms: 50     # ESP32 feedback window (board -> Pi). KEEP THIS SHORT:
                                  #   the ~0.15 m/s wheel-speed QUANTIZATION is a FIRMWARE
                                  #   limit (fixed internal speed estimate) -- a longer
                                  #   window does NOT improve resolution and only adds
                                  #   latency (measured: 20ms->51ms vs 100ms->241ms step
                                  #   response). Precise low-speed odometry would need raw
                                  #   encoder COUNTS from the board, not this quantized speed.
    telemetry_rate: 20.0          # Hz, ROS republish rate for the dashboard (latest value)
